name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: package (Python 3.12, the pinned set)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Installs exactly pyproject.toml's pins, every one a PyPI release
      # (ifcopenshell-mcp without its [mcp] extra), with the test extra
      # (pytest, jsonschema).
      - run: python -m pip install --disable-pip-version-check ".[test]"
      - run: python -m pip freeze --all
      - run: python -m pytest -v

  image:
    name: image (confined as flo2 runs it)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t flo2-ifc:ci .
      - name: It answers --version with no network, a read-only root and an unprivileged user
        run: docker run --rm --network none --read-only --cap-drop ALL --user 65534:65534 flo2-ifc:ci --version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ".[test]"
      # The smoke test's own questions (initialize, the 31 tools, ifc_new then
      # ifc_summary, a synthetic millimetre house opened from /design and read
      # with the paged readers, its extent and its validation, then measured and
      # drawn to a PNG inside the image's /tmp), and the tool list compared
      # with flo2-ifc 0.3.1's (tests/test_tool_list.py), asked of the
      # image under flo2-tool-sandbox's flags, with a folder mounted read-only
      # at /design, as flo2 mounts a design's.
      - name: A folder for the house, mounted as a design is
        run: mkdir -p "$RUNNER_TEMP/design" && chmod 0755 "$RUNNER_TEMP/design"
      - name: It serves its 31 tools over stdio, confined like flo2's slot
        env:
          FLO2_IFC_DESIGN_DIR: ${{ runner.temp }}/design
          FLO2_IFC_DESIGN_SEEN_AS: /design
          FLO2_IFC_SERVER: >-
            docker run --rm -i --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m
            --memory 1g --memory-swap 1g --cpus 1 --pids-limit 64
            --cap-drop ALL --security-opt no-new-privileges --user 65534:65534
            --mount type=bind,source=${{ runner.temp }}/design,target=/design,readonly
            flo2-ifc:ci
        run: python -m pytest -v tests/test_smoke.py tests/test_tool_list.py
