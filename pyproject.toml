[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flo2-ifc"
version = "0.5.0"
description = "The exact ifcmcp set flo2.io runs: the tools of IfcOpenShell's MCP server for IFC building models, served on the MCP Python SDK 2.x, with IDS checks and buildingSMART's validation rules, pinned."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Anthony Sligar" }]
# This repository's own files. ifcmcp and IfcOpenShell, which it installs,
# stay LGPL-3.0-or-later.
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["IFC", "BIM", "MCP", "ifcopenshell", "ifcmcp"]

# EVERY dependency is pinned exactly. This list IS the set flo2.io installs:
# the Dockerfile installs this package and nothing else, and
# tools/dependency_currency.py checks each pin against its latest release
# once a month. Why each one is here is in README.md, "What is pinned and why".
dependencies = [
  # ifcmcp's tool code (core.py), from IfcOpenShell's own release on PyPI.
  # WITHOUT its [mcp] extra: that extra asks for mcp>=1,<2, and core.py never
  # imports mcp. flo2-ifc's own server (src/flo2_ifc/server.py) registers
  # every one of ifcmcp's tools on the MCP Python SDK 2.x pinned below.
  "ifcopenshell-mcp==0.9.0",
  "mcp==2.3.0",
  # ifcmcp leaves its helpers unpinned, and they decide what a model can measure.
  "ifcopenshell==0.9.0",
  "ifcquery==0.9.0",
  "ifcedit==0.9.0",
  "ifc5d==0.9.0",
  # Without networkx, `ifcedit list` prints "Note: API not available" to stdout
  # ahead of its JSON.
  "networkx==3.7",
  # ifc_validate's express_rules runs IfcOpenShell's rule executor, which
  # imports pytest's assertion rewriting (ifcopenshell/express/rule_executor.py,
  # `from _pytest import assertion`). Without pytest, that check fails with
  # "No module named '_pytest'", and flo2's model door offers it.
  "pytest==9.1.1",
  # flo2-ifc's extent reader (src/flo2_ifc/reading.py) takes each shape's
  # vertices as a numpy array. ifcopenshell already requires numpy; flo2-ifc
  # imports it itself, so it is pinned here, at the version ifcopenshell
  # 0.9.0 resolves to.
  "numpy==2.5.4",
  # flo2-ifc's measures and drawings (src/flo2_ifc/geometry.py, drawing.py):
  # a footprint is a union of plan projections, and a drawing's outlines are
  # unions of projected triangles. ifcopenshell 0.9.0 already requires
  # shapely, unpinned; flo2-ifc imports it itself, so it is pinned here, at
  # the version ifcopenshell 0.9.0 resolves to.
  "shapely==2.2.0",
  # A drawing's picture: the SVG rendered to PNG. It needs the cairo library,
  # which the Dockerfile installs in the image (libcairo2).
  "cairosvg==2.9.1",
  # ifc_check_ids and ifc_write_ids (src/flo2_ifc/checking.py): IfcOpenShell's
  # own IDS checker and IDS API, with the IDS 1.0 XSD it ships. ifctester
  # leaves its helpers unpinned; these two decide what an IDS says and
  # matches: xmlschema reads and checks it against the XSD (offline: it
  # carries the W3C schemas the XSD imports), and elementpath translates an
  # IDS pattern into the regular expression a value is matched with. Its
  # other helpers (flask, bcf-client, odfpy, pystache, python-dateutil) only
  # serve its web app, its BCF and ODS reports and its HTML template.
  "ifctester==0.9.0",
  "xmlschema==4.3.2",
  "elementpath==5.1.4",
  # ifc_check_rules (src/flo2_ifc/rules.py): buildingSMART's validation rules,
  # fetched at the release tools/ifc_rules.py pins, run with behave. These are
  # what the rules import when they run, at the versions the rules' own
  # requirements.txt pins (v1.0.5), except django, at the newest patch of the
  # same 5.2 LTS series (5.2.4 -> 5.2.18, security fixes; the rules use only
  # its model classes, with no database). numpy, shapely, networkx, pyparsing
  # and pydantic are the ones already here (the rules pin older ones); the
  # rules' own tests pass the same with either set (README.md, "buildingSMART's
  # rules"). Their test and CI tools (pytest-xdist, pandas, sqlalchemy,
  # tabulate, lark-parser) are not installed.
  "behave==1.2.6",
  "django==5.2.18",
  "python-dotenv==1.1.1",
  "rtree==1.4.0",
  "pyproj==3.7.1",
  "mpmath==1.3.0",
  "pydot==4.0.1",
  "pyspellchecker==0.8.3",
  "pyparsing==3.3.3",
  "pydantic==2.14.1",
]

[project.optional-dependencies]
# pytest is a runtime dependency above, so the test extra adds only jsonschema.
test = ["jsonschema==4.26.0"]

[project.scripts]
flo2-ifc = "flo2_ifc:main"

[project.urls]
Homepage = "https://github.com/flo2-connector/flo2-ifc"
Repository = "https://github.com/flo2-connector/flo2-ifc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
