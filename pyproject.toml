[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flo2-ifc"
version = "0.4.0"
description = "The exact ifcmcp set flo2.io runs: the tools of IfcOpenShell's MCP server for IFC building models, served on the MCP Python SDK 2.x, pinned."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Anthony Sligar" }]
# This repository's own files. ifcmcp and IfcOpenShell, which it installs,
# stay LGPL-3.0-or-later.
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["IFC", "BIM", "MCP", "ifcopenshell", "ifcmcp"]

# EVERY dependency is pinned exactly. This list IS the set flo2.io installs:
# the Dockerfile installs this package and nothing else, and
# tools/dependency_currency.py checks each pin against its latest release
# once a month. Why each one is here is in README.md, "What is pinned and why".
dependencies = [
  # ifcmcp's tool code (core.py), from IfcOpenShell's own release on PyPI.
  # WITHOUT its [mcp] extra: that extra asks for mcp>=1,<2, and core.py never
  # imports mcp. flo2-ifc's own server (src/flo2_ifc/server.py) registers
  # every one of ifcmcp's tools on the MCP Python SDK 2.x pinned below.
  "ifcopenshell-mcp==0.9.0",
  "mcp==2.3.0",
  # ifcmcp leaves its helpers unpinned, and they decide what a model can measure.
  "ifcopenshell==0.9.0",
  "ifcquery==0.9.0",
  "ifcedit==0.9.0",
  "ifc5d==0.9.0",
  # Without networkx, `ifcedit list` prints "Note: API not available" to stdout
  # ahead of its JSON.
  "networkx==3.7",
  # ifc_validate's express_rules runs IfcOpenShell's rule executor, which
  # imports pytest's assertion rewriting (ifcopenshell/express/rule_executor.py,
  # `from _pytest import assertion`). Without pytest, that check fails with
  # "No module named '_pytest'", and flo2's model door offers it.
  "pytest==9.1.1",
  # flo2-ifc's extent reader (src/flo2_ifc/reading.py) takes each shape's
  # vertices as a numpy array. ifcopenshell already requires numpy; flo2-ifc
  # imports it itself, so it is pinned here, at the version ifcopenshell
  # 0.9.0 resolves to.
  "numpy==2.5.4",
  # flo2-ifc's measures and drawings (src/flo2_ifc/geometry.py, drawing.py):
  # a footprint is a union of plan projections, and a drawing's outlines are
  # unions of projected triangles. ifcopenshell 0.9.0 already requires
  # shapely, unpinned; flo2-ifc imports it itself, so it is pinned here, at
  # the version ifcopenshell 0.9.0 resolves to.
  "shapely==2.2.0",
  # A drawing's picture: the SVG rendered to PNG. It needs the cairo library,
  # which the Dockerfile installs in the image (libcairo2).
  "cairosvg==2.9.1",
]

[project.optional-dependencies]
# pytest is a runtime dependency above, so the test extra adds only jsonschema.
test = ["jsonschema==4.26.0"]

[project.scripts]
flo2-ifc = "flo2_ifc:main"

[project.urls]
Homepage = "https://github.com/flo2-connector/flo2-ifc"
Repository = "https://github.com/flo2-connector/flo2-ifc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
