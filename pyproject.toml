[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flo2-ifc"
version = "0.1.0"
description = "The exact ifcmcp set flo2.io runs: IfcOpenShell's MCP server for IFC building models, on the MCP Python SDK 2.x, pinned."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Anthony Sligar" }]
# This repository's own files. ifcmcp and IfcOpenShell, which it installs,
# stay LGPL-3.0-or-later.
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["IFC", "BIM", "MCP", "ifcopenshell", "ifcmcp"]

# EVERY dependency is pinned exactly. This list IS the set flo2.io installs:
# the Dockerfile installs this package and nothing else, and
# tools/dependency_currency.py checks each pin against its latest release
# once a month. Why each one is here is in README.md, "What is pinned and why".
dependencies = [
  # ifcmcp ported to the MCP Python SDK 2.x (MCPServer), on Anthony's fork,
  # branch ifcmcp/mcp-python-sdk-2. Every ifcopenshell-mcp on PyPI so far
  # requires mcp<2. The [mcp] extra makes the resolver hold mcp to the range
  # the fork itself declares (>=2,<3).
  "ifcopenshell-mcp[mcp] @ git+https://github.com/sligara7/IfcOpenShell@0ea3edc7a38d08c4c40918201357bd637fdaa39d#subdirectory=src/ifcmcp",
  "mcp==2.3.0",
  # ifcmcp leaves its helpers unpinned, and they decide what a model can measure.
  "ifcopenshell==0.9.0",
  "ifcquery==0.9.0",
  "ifcedit==0.9.0",
  "ifc5d==0.9.0",
  # Without networkx, `ifcedit list` prints "Note: API not available" to stdout
  # ahead of its JSON.
  "networkx==3.7",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "jsonschema==4.26.0"]

[project.scripts]
flo2-ifc = "flo2_ifc:main"

[project.urls]
Homepage = "https://github.com/sligara7/flo2-ifc"
Repository = "https://github.com/sligara7/flo2-ifc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
